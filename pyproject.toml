[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "vision-annotation-audit"
version = "0.1.0"
description = "Offline COCO annotation quality auditor"
requires-python = ">=3.10"
[project.scripts]
vision-audit = "vision_audit.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
